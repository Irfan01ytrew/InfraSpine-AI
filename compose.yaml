# InfraSpine production Compose stack.
# Canonical file for new deployments. compose.onprem.yaml is kept for existing
# on-prem checkouts that already use it.
#
#   cp .env.docker.example .env   # then fill required secrets
#   make up && make migrate
#
# Optional profiles: qdrant, ollama, debug, baileys-sidecar
# Build args: INSTALL_MEDIA_RUNTIME, INSTALL_BAILEYS
# Do not point this stack at a live Windows Postgres database.

x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  args:
    INSTALL_MEDIA_RUNTIME: ${INSTALL_MEDIA_RUNTIME:-false}
    INSTALL_BAILEYS: ${INSTALL_BAILEYS:-false}

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?Set MASTER_ENCRYPTION_KEY}
  MASTER_ENCRYPTION_KEY_ID: ${MASTER_ENCRYPTION_KEY_ID:-v1}
  LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
  LICENSE_ENFORCEMENT_ENABLED: ${LICENSE_ENFORCEMENT_ENABLED:-false}
  LLM_LOCAL_ONLY: ${LLM_LOCAL_ONLY:-false}
  LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  RAG_DATA_DIR: /var/lib/infraspine/data
  RAG_MODELS_DIR: /var/lib/infraspine/data/models
  HF_HOME: /var/lib/infraspine/data/models/huggingface
  HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-false}
  TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-false}
  RAG_VECTOR_STORE: ${RAG_VECTOR_STORE:-faiss}
  API_WORKERS: ${API_WORKERS:-1}
  API_SERVER: ${API_SERVER:-uvicorn}
  RAG_INDEX_ROLE: ${RAG_INDEX_ROLE:-owner}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_POOL_MAX_OVERFLOW: ${DATABASE_POOL_MAX_OVERFLOW:-10}
  RAG_QDRANT_URL: ${RAG_QDRANT_URL:-http://qdrant:6333}
  RAG_QDRANT_API_KEY: ${RAG_QDRANT_API_KEY:-}
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
  RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-384}
  RAG_EMBEDDING_ALLOW_DOWNLOAD: ${RAG_EMBEDDING_ALLOW_DOWNLOAD:-true}
  RAG_IMPORT_MAX_FILE_MB: ${RAG_IMPORT_MAX_FILE_MB:-4096}
  RAG_IMPORT_ROOT: ${RAG_IMPORT_ROOT:-/imports}
  RAG_MEDIA_ENABLED: ${RAG_MEDIA_ENABLED:-false}
  RAG_MEDIA_MODEL_PATH: ${RAG_MEDIA_MODEL_PATH:-}
  RAG_MEDIA_DEVICE: ${RAG_MEDIA_DEVICE:-cpu}
  RAG_EXTERNAL_RESEARCH_ENABLED: ${RAG_EXTERNAL_RESEARCH_ENABLED:-false}
  RAG_INGESTION_MODE: worker
  RAG_WORKER_ENABLED: "false"
  # Unified workflow runtime (automations, invoices, governance actions); set false to stop it (kill switch).
  WORKFLOW_ENGINE_WORKER_ENABLED: ${WORKFLOW_ENGINE_WORKER_ENABLED:-true}
  RAG_INDEX_SYNC_SECONDS: ${RAG_INDEX_SYNC_SECONDS:-2}
  LOG_DIR: /var/lib/infraspine/logs
  PROVIDER_TRUSTED_PRIVATE_ORIGINS: ${PROVIDER_TRUSTED_PRIVATE_ORIGINS:-http://ollama:11434}

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${INFRASPINE_POSTGRES_DIR:-./docker-data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [infraspine]
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    cpus: ${POSTGRES_CPUS:-1.0}

  postgres-backup:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ${INFRASPINE_BACKUP_DIR:-./docker-data/backups}:/backups
      - ./docker/postgres/backup.sh:/backup.sh:ro
      - ./docker/postgres/restore.sh:/restore.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    networks: [infraspine]
    mem_limit: 256m
    cpus: "0.25"

  api:
    image: ${INFRASPINE_IMAGE:-infraspine-ai:local}
    build: *app-build
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      <<: *app-environment
      RAG_WORKER_ENABLED: "false"
    volumes:
      - ${INFRASPINE_DATA_DIR:-./docker-data/data}:/var/lib/infraspine/data
      - ${INFRASPINE_LOG_DIR:-./docker-data/logs}:/var/lib/infraspine/logs
      - ${INFRASPINE_IMPORT_DIR:-./docker-data/imports}:/imports:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks: [infraspine]
    mem_limit: ${API_MEM_LIMIT:-3g}
    cpus: ${API_CPUS:-2.0}
    command: ["api"]

  worker:
    image: ${INFRASPINE_IMAGE:-infraspine-ai:local}
    build: *app-build
    restart: unless-stopped
    logging: *bounded-logs
    command: ["worker"]
    environment:
      <<: *app-environment
      RAG_DATABASE_ANALYSIS_URL: ""
      RAG_DATABASE_ANALYSIS_SQLITE_PATH: ""
      RAG_DATABASE_ANALYSIS_CATALOG: ""
      RAG_DATABASE_ANALYSIS_DEPARTMENT_GRANTS: ""
    volumes:
      - ${INFRASPINE_DATA_DIR:-./docker-data/data}:/var/lib/infraspine/data
      - ${INFRASPINE_LOG_DIR:-./docker-data/logs}:/var/lib/infraspine/logs
      - ${INFRASPINE_IMPORT_DIR:-./docker-data/imports}:/imports:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 30s
      timeout: 120s
      retries: 3
      start_period: 180s
    networks: [infraspine]
    mem_limit: ${WORKER_MEM_LIMIT:-4g}
    cpus: ${WORKER_CPUS:-2.0}

  frontend:
    image: ${INFRASPINE_FRONTEND_IMAGE:-infraspine-frontend:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${INFRASPINE_HTTP_PORT:-80}:8080"
      - "127.0.0.1:${INFRASPINE_HTTPS_PORT:-443}:8443"
    volumes:
      - ${INFRASPINE_TLS_DIR:-./docker-data/certs}:/etc/nginx/certs:ro
    networks: [infraspine]
    mem_limit: 256m
    cpus: "0.50"

  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    profiles: [qdrant]
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      QDRANT__SERVICE__API_KEY: ${RAG_QDRANT_API_KEY:-}
    volumes:
      - ${INFRASPINE_QDRANT_DIR:-./docker-data/qdrant}:/qdrant/storage
    expose:
      - "6333"
      - "6334"
    networks: [infraspine]
    mem_limit: ${QDRANT_MEM_LIMIT:-1g}
    cpus: "1.0"

  ollama:
    image: ollama/ollama:0.12.6
    profiles: [ollama]
    restart: unless-stopped
    logging: *bounded-logs
    volumes:
      - ${INFRASPINE_OLLAMA_DIR:-./docker-data/ollama}:/root/.ollama
    expose:
      - "11434"
    networks: [infraspine]
    mem_limit: ${OLLAMA_MEM_LIMIT:-4g}
    cpus: "2.0"

  baileys:
    profiles: [baileys-sidecar]
    image: ${INFRASPINE_BAILEYS_IMAGE:-infraspine-baileys:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.baileys
    restart: unless-stopped
    logging: *bounded-logs
    network_mode: none
    mem_limit: 512m
    cpus: "0.50"

networks:
  infraspine:
    driver: bridge
    ipam:
      config:
        - subnet: ${INFRASPINE_NETWORK_SUBNET:-10.243.0.0/24}
