services:
  postgres:
    image: postgres:18.6-alpine@sha256:83148c0bc09eac4d598b70a61e1404d0212b76c95c504bfd6c81a4c59ec91792
    environment:
      POSTGRES_DB: ${VERIFY_DB_NAME:?generated by scripts/verify_host.ps1}
      POSTGRES_USER: ${VERIFY_DB_USER:?generated by scripts/verify_host.ps1}
      POSTGRES_PASSWORD: ${VERIFY_DB_PASSWORD:?generated by scripts/verify_host.ps1}
    ports:
      - "127.0.0.1:${VERIFY_POSTGRES_PORT:?generated by scripts/verify_host.ps1}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    environment:
      QDRANT__SERVICE__API_KEY: ${VERIFY_QDRANT_API_KEY:?generated by scripts/verify_host.ps1}
    ports:
      - "127.0.0.1:${VERIFY_QDRANT_PORT:?generated by scripts/verify_host.ps1}:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  backend-test:
    profiles: [verification]
    build:
      context: .
      dockerfile: Dockerfile.verify
    environment:
      APP_ENV: testing
      HF_HOME: /root/.cache/huggingface
      DATABASE_URL: postgresql+asyncpg://${VERIFY_DB_USER:?generated by scripts/verify_host.ps1}:${VERIFY_DB_PASSWORD:?generated by scripts/verify_host.ps1}@postgres:5432/${VERIFY_DB_GUARD:?generated by scripts/verify_host.ps1}
      TEST_DATABASE_URL: postgresql+asyncpg://${VERIFY_DB_USER:?generated by scripts/verify_host.ps1}:${VERIFY_DB_PASSWORD:?generated by scripts/verify_host.ps1}@postgres:5432/${VERIFY_DB_NAME:?generated by scripts/verify_host.ps1}
      QDRANT_TEST_URL: http://qdrant:6333
      QDRANT_TEST_API_KEY: ${VERIFY_QDRANT_API_KEY:?generated by scripts/verify_host.ps1}
      RAG_VECTOR_STORE: faiss
      LOG_DIR: ""
    volumes:
      - verification-model-cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  postgres-data:
  qdrant-data:
  verification-model-cache:
    external: true
    name: infraspine-verification-model-cache

networks:
  default:
    external: true
    name: ${VERIFY_DOCKER_NETWORK:?generated by scripts/verify_host.ps1}
