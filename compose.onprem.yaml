# Note: new deployments should use compose.yaml (see docs/deploy-docker.md).
# This file is kept for existing on-prem checkouts.
x-default-logging: &bounded-logs
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.6-alpine@sha256:83148c0bc09eac4d598b70a61e1404d0212b76c95c504bfd6c81a4c59ec91792
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.onprem}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.onprem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.onprem}
    volumes:
      - ${INFRASPINE_POSTGRES_DIR:-./onprem-postgres}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [infraspine]

  api:
    image: ${INFRASPINE_IMAGE:-infraspine-ai:release-candidate}
    build:
      context: .
      args:
        INSTALL_MEDIA_RUNTIME: ${INSTALL_MEDIA_RUNTIME:-false}
    restart: unless-stopped
    logging: *bounded-logs
    environment: &app-environment
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the compose postgres service}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?Set MASTER_ENCRYPTION_KEY in .env.onprem}
      MASTER_ENCRYPTION_KEY_ID: ${MASTER_ENCRYPTION_KEY_ID:-v1}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      LICENSE_ENFORCEMENT_ENABLED: ${LICENSE_ENFORCEMENT_ENABLED:-false}
      LLM_LOCAL_ONLY: ${LLM_LOCAL_ONLY:-false}
      SESSION_COOKIE_SECURE: "true"
      RAG_DATA_DIR: /var/lib/infraspine/data
      RAG_MODELS_DIR: /var/lib/infraspine/data/models
      HF_HOME: /var/lib/infraspine/data/models/huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-true}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-true}
      RAG_VECTOR_STORE: ${RAG_VECTOR_STORE:-faiss}
      API_WORKERS: ${API_WORKERS:-1}
      RAG_INDEX_ROLE: ${RAG_INDEX_ROLE:-owner}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_POOL_MAX_OVERFLOW: ${DATABASE_POOL_MAX_OVERFLOW:-10}
      RAG_QDRANT_URL: ${RAG_QDRANT_URL:-http://qdrant:6333}
      RAG_QDRANT_API_KEY: ${RAG_QDRANT_API_KEY:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-384}
      RAG_EMBEDDING_ALLOW_DOWNLOAD: ${RAG_EMBEDDING_ALLOW_DOWNLOAD:-false}
      RAG_IMPORT_MAX_FILE_MB: ${RAG_IMPORT_MAX_FILE_MB:-4096}
      RAG_IMPORT_ROOT: ${RAG_IMPORT_ROOT:-/imports}
      RAG_MEDIA_ENABLED: ${RAG_MEDIA_ENABLED:-false}
      RAG_MEDIA_MODEL_PATH: ${RAG_MEDIA_MODEL_PATH:-}
      RAG_MEDIA_DEVICE: ${RAG_MEDIA_DEVICE:-cpu}
      RAG_MEDIA_CPU_THREADS: ${RAG_MEDIA_CPU_THREADS:-4}
      RAG_OCR_CPU_THREADS: ${RAG_OCR_CPU_THREADS:-1}
      RAG_MEDIA_MAX_FILE_MB: ${RAG_MEDIA_MAX_FILE_MB:-8192}
      RAG_MEDIA_MAX_DURATION_SECONDS: ${RAG_MEDIA_MAX_DURATION_SECONDS:-14400}
      RAG_MEDIA_SEGMENT_SECONDS: ${RAG_MEDIA_SEGMENT_SECONDS:-300}
      RAG_MEDIA_VIDEO_FRAME_OCR_ENABLED: ${RAG_MEDIA_VIDEO_FRAME_OCR_ENABLED:-true}
      RAG_MEDIA_VIDEO_FRAME_INTERVAL_SECONDS: ${RAG_MEDIA_VIDEO_FRAME_INTERVAL_SECONDS:-30}
      RAG_MEDIA_VIDEO_MAX_FRAMES: ${RAG_MEDIA_VIDEO_MAX_FRAMES:-300}
      RAG_EXTERNAL_RESEARCH_ENABLED: ${RAG_EXTERNAL_RESEARCH_ENABLED:-false}
      RAG_DATABASE_ANALYSIS_URL: ${RAG_DATABASE_ANALYSIS_URL:-}
      RAG_DATABASE_ANALYSIS_SQLITE_PATH: ${RAG_DATABASE_ANALYSIS_SQLITE_PATH:-}
      RAG_DATABASE_ANALYSIS_SQLITE_ROOT: ${RAG_DATABASE_ANALYSIS_SQLITE_ROOT:-/var/lib/infraspine/data/business}
      RAG_DATABASE_ANALYSIS_CATALOG: ${RAG_DATABASE_ANALYSIS_CATALOG:-}
      RAG_DATABASE_ANALYSIS_DEPARTMENT_GRANTS: ${RAG_DATABASE_ANALYSIS_DEPARTMENT_GRANTS:-}
      RAG_DATABASE_ANALYSIS_SOURCE_LABEL: ${RAG_DATABASE_ANALYSIS_SOURCE_LABEL:-Business database}
      RAG_DATABASE_ANALYSIS_STATEMENT_TIMEOUT_MS: ${RAG_DATABASE_ANALYSIS_STATEMENT_TIMEOUT_MS:-5000}
      RAG_DATABASE_ANALYSIS_MAX_ROWS: ${RAG_DATABASE_ANALYSIS_MAX_ROWS:-100}
      PERSONAL_TASK_EMAIL_ENABLED: ${PERSONAL_TASK_EMAIL_ENABLED:-false}
      PERSONAL_TASK_SMTP_HOST: ${PERSONAL_TASK_SMTP_HOST:-}
      PERSONAL_TASK_SMTP_PORT: ${PERSONAL_TASK_SMTP_PORT:-587}
      PERSONAL_TASK_SMTP_SECURITY: ${PERSONAL_TASK_SMTP_SECURITY:-starttls}
      PERSONAL_TASK_SMTP_USERNAME: ${PERSONAL_TASK_SMTP_USERNAME:-}
      PERSONAL_TASK_SMTP_PASSWORD: ${PERSONAL_TASK_SMTP_PASSWORD:-}
      PERSONAL_TASK_EMAIL_FROM: ${PERSONAL_TASK_EMAIL_FROM:-}
      PERSONAL_TASK_SMTP_TIMEOUT_SECONDS: ${PERSONAL_TASK_SMTP_TIMEOUT_SECONDS:-15}
      RAG_INGESTION_MODE: worker
      RAG_WORKER_ENABLED: "false"
      RAG_INDEX_SYNC_SECONDS: "2"
      LOG_DIR: /var/lib/infraspine/logs
      PROVIDER_TRUSTED_PRIVATE_ORIGINS: ${PROVIDER_TRUSTED_PRIVATE_ORIGINS:-}
    volumes:
      - ${INFRASPINE_DATA_DIR:-./onprem-data}:/var/lib/infraspine/data
      - ${INFRASPINE_LOG_DIR:-./onprem-logs}:/var/lib/infraspine/logs
      - ${INFRASPINE_IMPORT_DIR:-./imports}:/imports:ro
      - ${INFRASPINE_BACKUP_DIR:-./onprem-backups}:/var/lib/infraspine/backups
    ports:
      - "127.0.0.1:${INFRASPINE_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [infraspine]

  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    profiles: [qdrant]
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      QDRANT__SERVICE__API_KEY: ${RAG_QDRANT_API_KEY:-}
    volumes:
      - ${INFRASPINE_QDRANT_DIR:-./onprem-qdrant}:/qdrant/storage
    expose:
      - "6333"
      - "6334"
    networks: [infraspine]

  snapshot:
    profiles: [ops]
    image: ${INFRASPINE_IMAGE:-infraspine-ai:release-candidate}
    build:
      context: .
      args:
        INSTALL_MEDIA_RUNTIME: ${INSTALL_MEDIA_RUNTIME:-false}
    command: ["python", "-m", "app.cli", "--help"]
    logging: *bounded-logs
    environment:
      APP_ENV: production
      RAG_DATA_DIR: /var/lib/infraspine/data
    volumes:
      - ${INFRASPINE_DATA_DIR:-./onprem-data}:/var/lib/infraspine/data:ro
      - ${INFRASPINE_BACKUP_DIR:-./onprem-backups}:/var/lib/infraspine/backups:rw
      - ${INFRASPINE_QDRANT_DIR:-./onprem-qdrant}:/var/lib/infraspine/qdrant-snapshot:ro
    network_mode: none

  worker:
    image: ${INFRASPINE_IMAGE:-infraspine-ai:release-candidate}
    build:
      context: .
      args:
        INSTALL_MEDIA_RUNTIME: ${INSTALL_MEDIA_RUNTIME:-false}
    restart: unless-stopped
    logging: *bounded-logs
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-environment
      # The external business-database credential is consumed by the API only.
      RAG_DATABASE_ANALYSIS_URL: ""
      # Business reporting data is only opened by the API; the worker gets no connector path.
      RAG_DATABASE_ANALYSIS_SQLITE_PATH: ""
      RAG_DATABASE_ANALYSIS_CATALOG: ""
      RAG_DATABASE_ANALYSIS_DEPARTMENT_GRANTS: ""
    volumes:
      - ${INFRASPINE_DATA_DIR:-./onprem-data}:/var/lib/infraspine/data
      - ${INFRASPINE_LOG_DIR:-./onprem-logs}:/var/lib/infraspine/logs
      - ${INFRASPINE_IMPORT_DIR:-./imports}:/imports:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 30s
      # Slow host cold-start/imports have exceeded 30 seconds in QA; allow the bounded config/DB/model check to finish.
      timeout: 120s
      retries: 3
      start_period: 180s
    networks: [infraspine]

networks:
  infraspine:
    driver: bridge
    ipam:
      config:
        - subnet: ${INFRASPINE_NETWORK_SUBNET:-10.243.0.0/24}

