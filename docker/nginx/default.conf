# Public entry for InfraSpine. API stays on the internal network.
# HTTP on 8080 (published as 80). If /etc/nginx/certs/tls.crt and tls.key
# exist, TLS is also served on 8443 (published as 443).

upstream infraspine_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /admin/;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location /api/ {
        proxy_pass http://infraspine_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location /health {
        proxy_pass http://infraspine_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location /docs {
        proxy_pass http://infraspine_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://infraspine_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://infraspine_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# TLS is enabled only when certificate files are present. The optional
# include is a no-op if the file was not mounted.
include /etc/nginx/conf.d/tls.conf.optional;
