; Step AO slice 3 — PgBouncer option for deployments with more than one
; API process. This is an OPTION, not a forced change: the Codespace demo
; runs one process and does not need PgBouncer today (plan doc §4).
;
; Validate with app.ops.db_performance.validate_pgbouncer_config().
; - Transaction pooling: a server connection is returned to the pool at
;   every transaction end, so one Postgres backend serves many clients.
;   Session pooling would hold a backend per client and defeat the point.
; - server_reset_query = DISCARD ALL: no session state (temporary
;   tables, prepared statements, SET values) may leak between clients.
; - Pool sizes: default_pool_size 20 covers the app's SQLAlchemy pool
;   (5 + 10 overflow) with headroom for a second process; raise it
;   before adding a third. max_client_conn 100 caps the front door.
; - The application must connect through PgBouncer's port (6432 here),
;   never directly to PostgreSQL, once this file is in use.
; - auth: PgBouncer reads users from auth_file (auth_query against the
;   database is the alternative); passwords in auth_file are md5/scram
;   hashes, never plaintext. Fill in the host and database for your
;   deployment; never commit real credentials in this file.

[databases]
; The * entry routes every database through the same pool settings;
; name the application database explicitly when several share a host.
infraspine = host=127.0.0.1 port=5432 dbname=infraspine

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
server_reset_query = DISCARD ALL
max_client_conn = 100
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 600
server_lifetime = 3600
ignore_startup_parameters = extra_float_digits
